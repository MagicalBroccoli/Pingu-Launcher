name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free disk space
        run: |
          # The 14 kernel and header packages and two container images need more than the default.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Check the tag against the launcher version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' launcher/Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match launcher version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang lld podman python3 zstd curl

      # The SteamOS modules are tested in a VM, which needs KVM.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      # Valve builds its kernels on Arch Linux (a new GCC, pahole and objtool libraries that
      # Ubuntu lacks), so the modules are built and tested in an Arch container with KVM.
      - name: Build and test the SteamOS modules
        run: |
          make bootstrap pingu-policy/validation/manifest.json
          podman run --rm --device /dev/kvm -v "$PWD:/src" -w /src docker.io/archlinux/archlinux:base-devel \
            sh -ec 'pacman -Syu --noconfirm --needed python pahole libelf bc zstd qemu-system-x86 >/dev/null
                    python3 tools/steamos-prebuilt.py --jobs "$(nproc)"'
          podman rmi docker.io/archlinux/archlinux:base-devel || true

      - name: Keep the module build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: steamos-build-logs
          path: .work/steamos/*/*/build.log

      # The modules are up to date now, so this only embeds them.
      # The launcher is built in a Debian 11 container, so it runs on glibc 2.31 or newer.
      - name: Build the portable launcher
        run: make launcher-dist

      # The notes list the commits since the previous tag, grouped by commit type.
      - name: Generate the changelog from the commits
        run: |
          pipx install commitizen
          previous=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          cz changelog ${previous:+--start-rev "$previous"} --dry-run > "$RUNNER_TEMP/changelog.md"
          cat "$RUNNER_TEMP/changelog.md"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset="pingu-launcher-$VERSION-x86_64"
          install -m 755 build/dist/target/release/pingu-launcher "$asset"
          sha256sum "$asset" > "$asset.sha256"
          gh release create "$GITHUB_REF_NAME" "$asset" "$asset.sha256" \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/changelog.md" --verify-tag
