name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang lld libfontconfig1-dev libfreetype6-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            launcher
            module-tool
            pingu-hook

      - name: Formatting
        run: |
          for crate in launcher module-tool pingu-hook; do
            cargo fmt --manifest-path "$crate/Cargo.toml" --all --check
          done

      # The static test helpers and the module tool the launcher embeds.
      - name: Build module fixtures
        run: make bootstrap pingu-policy/validation/manifest.json

      - name: Clippy
        run: |
          for crate in launcher module-tool; do
            cargo clippy --locked --manifest-path "$crate/Cargo.toml" --all-targets -- -D warnings
          done

      - name: Launcher and module tool tests
        run: make test

      - name: pingu-hook tests
        run: cargo test --locked --manifest-path pingu-hook/Cargo.toml

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit messages
        run: |
          pipx install commitizen
          cz check --rev-range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
