[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "commitizen"
version = "0.2.0"
tag_format = "v$version"
annotated_tag = true
major_version_zero = true
update_changelog_on_bump = true
bump_message = "chore(release): $current_version -> $new_version"
version_files = ["launcher/Cargo.toml:^version"]
pre_bump_hooks = [
    "cargo update --offline -p pingu-launcher --manifest-path launcher/Cargo.toml",
    "make launcher-screenshot",
]
