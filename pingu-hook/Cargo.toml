[package]
name = "pingu-hook-protocol"
version = "26.9.16"
edition = "2024"
rust-version.workspace = true
description = "Safe protocol core of the pingu-hook preload library"
license-file = "LICENSE"
publish = false

[workspace]
members = ["runtime", "xtask"]
default-members = [".", "runtime"]
resolver = "3"

[workspace.package]
rust-version = "1.98"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[lib]
name = "pingu_protocol"
path = "protocol/lib.rs"

[workspace.lints.rust]
missing_docs = "allow"
unsafe_op_in_unsafe_fn = "deny"

[lints]
workspace = true
