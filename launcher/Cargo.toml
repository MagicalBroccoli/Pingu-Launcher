[package]
name = "pingu-launcher"
version = "0.3.1"
edition = "2024"
publish = false

[lib]
name = "pingu_launcher"
path = "src/lib.rs"

[[bin]]
name = "pingu-launcher"
path = "src/main.rs"

[dependencies]
flate2 = "1"
libc = "0.2"
serde_json = "1"
sha2 = "0.11.1"
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "renderer-femtovg",
] }
tar = { version = "0.4", default-features = false }

[build-dependencies]
slint-build = "1.18"

# Only the screenshot example renders without a display.
[dev-dependencies]
slint = { version = "1.18", default-features = false, features = [
    "std",
    "compat-1-2",
    "renderer-software",
    "software-renderer-systemfonts",
] }

[profile.release]
strip = true
